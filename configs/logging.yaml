# DeepSight Logging Configuration

version: 1

formatters:
  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "node": "%(name)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

  console:
    format: "[%(asctime)s] %(levelname)-8s [%(name)s] %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    stream: ext://sys.stdout

  host_file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/host/host.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5

  pi_file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/pi/pi.log
    maxBytes: 10485760
    backupCount: 5

loggers:
  host:
    level: INFO
    handlers: [console, host_file]
    propagate: false

  host.network:
    level: WARNING
    handlers: [console, host_file]
    propagate: false

  host.tracking:
    level: DEBUG
    handlers: [console, host_file]
    propagate: false

  host.control:
    level: DEBUG
    handlers: [console, host_file]
    propagate: false

  pi:
    level: DEBUG
    handlers: [console, pi_file]
    propagate: false

  shared:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
