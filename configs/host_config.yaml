host:
  id: host
  udp_port: 5005
  ws_port: 5001
network:
  pi_address: 192.168.20.51
  pi_udp_port: 5100
  pi_ws_port: 5101
video:
  stream_url: udp://0.0.0.0:8554
mock:
  enabled: true
  video_source: file
  tracking_target: none
  frame_width: 854
  frame_height: 480
  fps: 30
tracking:
  mode: fast
  model_path: models/freediver_s.pt
  confidence_threshold: 0.5
  iou_threshold: 0.45
control:
  pid_p: 0.8
  pid_i: 0.05
  pid_d: 0.2
  max_servo_speed: 15.0
  dead_zone: 0.02
  pos_deadband: 0.005
  out_ema_alpha: 0.75
gimbal:
  yaw_max_angle: 15.0
  pitch_max_angle: 15.0
plate:
  max_angle: 45.0
safety:
  tracking_lost_hold_s: 0.5
  tracking_lost_neutral_s: 2.0
  servo_neutral_angle: 90.0
logging:
  level: DEBUG
  dir: logs/host/
  telemetry_record: false
