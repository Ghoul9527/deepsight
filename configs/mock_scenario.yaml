# Mock hardware scenario configuration
# Defines how mock sensors behave

depth_profile:
  type: "sine_cycle"    # "sine_cycle" | "constant" | "linear_descent"
  min_depth_m: 0.0
  max_depth_m: 20.0
  period_s: 120.0       # Full dive cycle duration

imu_profile:
  yaw_drift_rate: 0.5   # deg/s drift
  pitch_amplitude: 5.0  # degrees
  roll_amplitude: 3.0
  noise_std: 0.1

tracking_target:
  bbox_size: [0.05, 0.1]       # width, height (normalized)
  trajectory: "figure_eight"    # "figure_eight" | "random_walk" | "static"
  speed: 0.1                    # normalized units/s
  noise_std: 0.005
  lost_probability: 0.0         # probability of target loss per frame

winch_simulation:
  initial_position_mm: 2500.0
  drift_speed_mm_s: 10.0

gopro_simulation:
  recording: false
  battery_pct: 85.0
  storage_gb_free: 128.0

env_simulation:
  water_temp_c: 27.0
  surface_temp_c: 32.0
  humidity_pct: 75.0
  pressure_hpa: 1013.25
