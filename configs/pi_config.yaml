# DeepSight Raspberry Pi 5 Configuration

pi:
  id: pi
  udp_port: 5100
  ws_port: 5101

network:
  host_address: "192.168.20.50"
  host_udp_port: 5005
  host_ws_port: 5001
  host_video_port: 8554          # Host UDP listen port for video forwarding

serial:
  pico_port: "/dev/ttyAMA0"     # Pico UART (set "mock" for simulated sensors)
  stm32_port: "/dev/ttyAMA1"    # STM32 UART (set "mock" for simulated winch)
  pico_baud: 115200
  stm32_baud: 115200

gopro:
  mock: false
  usb_iface: "usb0"             # USB Ethernet interface for wired control
  wifi_ssid: "GP25108532"       # Fallback WiFi AP
  wifi_password: "fZM-HDn-fsg"
  wifi_interface: "wlan0"

capture:
  mock: false
  device: "/dev/v4l/by-id/usb-Actions_Micro_UGREEN-25854_-66318299-video-index0"  # Real HDMI capture (persistent path)
  width: 1920
  height: 1080
  fps: 30

video:
  codec: "libx264"              # macOS/linux software; "h264_v4l2m2m" for Pi 5 hardware
  bitrate: "8M"
  stream_port: 8554            # TCP MPEG-TS server port (Host connects to this)

watchdog:
  heartbeat_interval_s: 0.5
  reconnect_delay_s: 2.0

logging:
  level: "DEBUG"
  dir: "logs/pi/"
