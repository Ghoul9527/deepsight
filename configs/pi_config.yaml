# DeepSight Pi Gateway Configuration

pi:
  id: pi
  udp_port: 5100
  ws_port: 5101

network:
  host_address: "192.168.20.50"
  host_udp_port: 5005
  host_ws_port: 5001

serial:
  pico_port: "/dev/ttyAMA0"     # Pico UART (set "mock" for simulated sensors)
  stm32_port: "/dev/ttyAMA1"    # STM32 UART (set "mock" for simulated winch)
  pico_baud: 115200
  stm32_baud: 115200

watchdog:
  heartbeat_interval_s: 0.5
  reconnect_delay_s: 2.0

logging:
  level: "DEBUG"
  dir: "logs/pi/"
