[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsight-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepsight-shared",
    "PySide6>=6.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-qt", "ruff", "mypy"]
tracking = ["torch>=2.0", "ultralytics>=8.0", "boxmot>=10.0"]
