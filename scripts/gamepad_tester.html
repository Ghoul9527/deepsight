<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSight Gamepad Tester</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --border: #0f3460;
  --text: #e0e0e0;
  --dim: #888;
  --accent: #e94560;
  --green: #00c853;
  --blue: #448aff;
  --orange: #ff9100;
  --yellow: #ffd600;
  --highlight: rgba(233, 69, 96, 0.7);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  display: flex;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ── Left Panel ──────────────────────────────────────── */
#left-panel {
  width: 380px;
  min-width: 380px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px;
  gap: 12px;
}

#left-panel h2 {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 2px;
}

.panel-section {
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
  padding: 12px;
}

.panel-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--dim);
  margin-bottom: 8px;
}

/* Info table */
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.info-row .label { color: var(--dim); }
.info-row .value { color: var(--green); }
.info-row .value.warn { color: var(--orange); }

/* Axis table */
.axis-row {
  display: grid;
  grid-template-columns: 32px 1fr 60px;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
  font-size: 12px;
}
.axis-name { color: var(--text); font-weight: 600; }
.axis-bar {
  height: 14px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.axis-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.05s linear, background 0.15s;
  position: absolute;
}
.axis-fill.positive { background: var(--blue); right: 50%; }
.axis-fill.negative { background: var(--orange); left: 50%; }
.axis-center {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  background: rgba(255,255,255,0.2);
}
.axis-val { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }

/* Button grid */
.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.btn-cell {
  display: flex;
  justify-content: space-between;
  padding: 3px 6px;
  font-size: 11px;
  border-radius: 3px;
  background: rgba(255,255,255,0.03);
  transition: all 0.08s;
}
.btn-cell.pressed {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 8px var(--highlight);
}
.btn-idx { color: var(--dim); }
.btn-cell.pressed .btn-idx { color: rgba(255,255,255,0.8); }

/* D-pad indicator */
.dpad-indicator {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
.dpad-arrow {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  transition: all 0.08s;
  font-size: 14px;
}
.dpad-arrow.active { background: var(--accent); box-shadow: 0 0 10px var(--highlight); }

/* Poll rate */
.poll-rate { font-size: 28px; font-weight: 700; color: var(--green); }
.poll-unit { font-size: 12px; color: var(--dim); }

/* ── Right Area (Gamepad) ────────────────────────────── */
#gamepad-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#gamepad-svg {
  width: 620px;
  height: 420px;
}

/* Stick position indicators */
.stick-pos {
  transition: cx 0.03s linear, cy 0.03s linear;
}

/* Button glow animation */
@keyframes btnPulse {
  0% { filter: drop-shadow(0 0 2px var(--accent)); }
  50% { filter: drop-shadow(0 0 12px var(--accent)); }
  100% { filter: drop-shadow(0 0 2px var(--accent)); }
}
.btn-pressed {
  animation: btnPulse 0.3s ease-out;
}

/* Trigger fill */
.trigger-fill {
  transition: height 0.05s linear;
}

/* Connection indicator */
#conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}
#conn-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
#conn-dot.disconnected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

/* Status bar */
#status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 11px;
  gap: 20px;
}
#status-bar span { color: var(--dim); }
#status-bar .ok { color: var(--green); }

</style>
</head>
<body>

<div id="status-bar">

<script>
// ── Constants ──────────────────────────────────────────
const AXIS_NAMES = ['LX', 'LY', 'RX', 'RY', 'LT', 'RT'];
const AXIS_COLORS = ['#ff9100', '#ff9100', '#448aff', '#448aff', '#e94560', '#00c853'];
// SDL2 button order labels (what we display and send to bridge)
const SDL2_LABELS = ['A','B','X','Y','LB','RB','Back','Start','L3','R3','Home','LTd','RTd'];

// Web Gamepad API ("standard" mapping) → SDL2 button index
// Web:  0=A  1=B  2=X  3=Y  4=LB  5=RB  6=LT  7=RT  8=Back  9=Start  10=L3  11=R3  12=↑  13=↓  14=←  15=→  16=Home
// SDL2: 0=A  1=B  2=X  3=Y  4=LB  5=RB  6=Back  7=Start  8=L3   9=R3    10=Home  11=LTd  12=RTd
// D-pad (web 12-15) → hat, not buttons
const WEB2SDL2 = [
   0,   // 0: A → 0
   1,   // 1: B → 1
   2,   // 2: X → 2
   3,   // 3: Y → 3
   4,   // 4: LB → 4
   5,   // 5: RB → 5
  11,   // 6: LT → 11 (LTd)
  12,   // 7: RT → 12 (RTd)
   6,   // 8: Back → 6
   7,   // 9: Start → 7
   8,   // 10: L3 → 8
   9,   // 11: R3 → 9
  -1,   // 12: D-pad Up → hat
  -1,   // 13: D-pad Down → hat
  -1,   // 14: D-pad Left → hat
  -1,   // 15: D-pad Right → hat
  10,   // 16: Home → 10
];

// SDL2 button index → SVG element ID (for visual highlight)
const SDL2_SVG = {
  0: 'btn-A', 1: 'btn-B', 2: 'btn-X', 3: 'btn-Y',
  4: 'btn-lb', 5: 'btn-rb', 6: 'btn-back', 7: 'btn-start',
  8: null, 9: null, 10: 'btn-home', 11: null, 12: null,
};

// ── State ─────────────────────────────────────────────
let pollCount = 0;
let pollRates = [];
let lastPollTime = performance.now();
let ws = null;

// ── Build UI elements ──────────────────────────────────
(function buildUI() {
  const axesTable = document.getElementById('axes-table');
  AXIS_NAMES.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'axis-row';
    row.innerHTML = `
      <span class="axis-name" style="color:${AXIS_COLORS[i]}">${name}</span>
      <div class="axis-bar">
        <div class="axis-fill negative" id="ax-neg-${i}"></div>
        <div class="axis-center"></div>
        <div class="axis-fill positive" id="ax-pos-${i}"></div>
      </div>
      <span class="axis-val" id="ax-val-${i}">0.0000</span>
    `;
    axesTable.appendChild(row);
  });

  const btnGrid = document.getElementById('btn-grid');
  SDL2_LABELS.forEach((name, i) => {
    const cell = document.createElement('div');
    cell.className = 'btn-cell';
    cell.id = `btn-cell-${i}`;
    cell.innerHTML = `<span class="btn-idx">#${i}</span><span>${name}</span>`;
    btnGrid.appendChild(cell);
  });
})();

// ── SVG element references ─────────────────────────────
const svgEls = {
  stickL: document.getElementById('stick-left'),
  stickR: document.getElementById('stick-right'),
  triggerL: document.getElementById('trigger-lt-fill'),
  triggerR: document.getElementById('trigger-rt-fill'),
  dpadUp: document.getElementById('dpad-up'),
  dpadDown: document.getElementById('dpad-down'),
  dpadLeft: document.getElementById('dpad-left'),
  dpadRight: document.getElementById('dpad-right'),
  gpStatus: document.getElementById('gp-status'),
};

// ── Apply state to UI ──────────────────────────────────
// data.buttons is already in SDL2 order (13 elements)
// data.hat is [x, y]: x = right(1)/left(-1), y = up(1)/down(-1)
function applyState(data) {
  const { axes, buttons, hat } = data;
  const now = performance.now();

  // Poll rate
  pollCount++;
  const dt = now - lastPollTime;
  lastPollTime = now;
  pollRates.push(dt);
  if (pollRates.length > 30) pollRates.shift();

  const avgDt = pollRates.reduce((a,b)=>a+b, 0) / pollRates.length;
  const hz = avgDt > 0 ? (1000 / avgDt) : 0;
  document.getElementById('info-hz').textContent = Math.round(hz);
  document.getElementById('sb-poll').textContent = `Poll: ${Math.round(hz)} Hz`;
  document.getElementById('sb-latency').textContent = `Latency: ${dt.toFixed(1)} ms`;

  document.getElementById('info-conn').textContent = 'Yes';
  document.getElementById('info-conn').className = 'value';
  document.getElementById('sb-conn').innerHTML = '● Connected';
  document.getElementById('sb-conn').className = 'ok';
  document.getElementById('conn-dot').className = 'connected';

  // Axes
  const hasAxis = axes.some(a => Math.abs(a) > 0.02);
  for (let i = 0; i < 6; i++) {
    const v = axes[i] || 0;
    document.getElementById(`ax-val-${i}`).textContent = v.toFixed(4);
    document.getElementById(`ax-pos-${i}`).style.width = v >= 0 ? (v * 50) + '%' : '0%';
    document.getElementById(`ax-neg-${i}`).style.width = v < 0 ? (Math.abs(v) * 50) + '%' : '0%';
  }

  // Buttons (SDL2 order)
  for (let i = 0; i < 13; i++) {
    const pressed = buttons[i] === 1;
    const cell = document.getElementById(`btn-cell-${i}`);
    if (cell) cell.classList.toggle('pressed', pressed);

    // SVG highlight
    const svgId = SDL2_SVG[i];
    if (svgId) {
      const el = document.getElementById(svgId);
      if (el) {
        el.setAttribute('fill', pressed ? '#e94560' : '#2a2a3a');
        el.setAttribute('stroke', pressed ? '#ff6b81' : (i >= 4 ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.2)'));
        if (pressed) el.setAttribute('filter', 'url(#glow)');
        else el.removeAttribute('filter');
      }
    }
  }

  // L3/R3 stick color (SDL2: L3=8, R3=9)
  const l3 = buttons[8] === 1;
  const r3 = buttons[9] === 1;
  svgEls.stickL.setAttribute('fill', l3 ? '#e94560' : '#3a3a50');
  if (l3) svgEls.stickL.setAttribute('filter', 'url(#glow)');
  else svgEls.stickL.removeAttribute('filter');
  svgEls.stickR.setAttribute('fill', r3 ? '#e94560' : '#3a3a50');
  if (r3) svgEls.stickR.setAttribute('filter', 'url(#glow)');
  else svgEls.stickR.removeAttribute('filter');

  // Sticks position
  // Web API: axes[1] = -1 (up), +1 (down). SVG y: negative=up, positive=down.
  // So axes[1] maps directly to SVG cy (no negation needed).
  const maxDisp = 16;
  svgEls.stickL.setAttribute('cx', (axes[0] || 0) * maxDisp);
  svgEls.stickL.setAttribute('cy', (axes[1] || 0) * maxDisp);
  svgEls.stickR.setAttribute('cx', (axes[2] || 0) * maxDisp);
  svgEls.stickR.setAttribute('cy', (axes[3] || 0) * maxDisp);

  // Triggers: analog axes (4=LT, 5=RT) or digital buttons (11=LTd, 12=RTd)
  const ltVal = Math.max(axes[4] || 0, buttons[11] === 1 ? 1.0 : 0);
  const rtVal = Math.max(axes[5] || 0, buttons[12] === 1 ? 1.0 : 0);
  svgEls.triggerL.setAttribute('height', Math.round(ltVal * 12));
  svgEls.triggerR.setAttribute('height', Math.round(rtVal * 12));

  // D-pad
  const hx = hat ? hat[0] : 0;
  const hy = hat ? hat[1] : 0;

  const dpadDirs = {
    up:    svgEls.dpadUp,
    down:  svgEls.dpadDown,
    left:  svgEls.dpadLeft,
    right: svgEls.dpadRight,
  };
  const active = {
    up:    hy > 0,
    down:  hy < 0,
    left:  hx < 0,
    right: hx > 0,
  };
  Object.keys(dpadDirs).forEach(dir => {
    if (dpadDirs[dir]) {
      dpadDirs[dir].setAttribute('fill', active[dir] ? '#e94560' : '#2a2a3a');
      if (active[dir]) dpadDirs[dir].setAttribute('filter', 'url(#glow)');
      else dpadDirs[dir].removeAttribute('filter');
    }
  });

  // D-pad UI panel arrows
  ['dup','ddown','dleft','dright'].forEach((elId, i) => {
    const el = document.getElementById(elId);
    if (el) el.classList.toggle('active', active[['up','down','left','right'][i]]);
  });

  if (hasAxis || buttons.some(b => b !== 0)) {
    svgEls.gpStatus.textContent = '';
  }
}

// ── WebSocket ──────────────────────────────────────────
function connectWS() {
  ws = new WebSocket('ws://localhost:9877');
  ws.onopen = () => {
    document.getElementById('sb-conn').innerHTML = '● Connected (bridge)';
    document.getElementById('sb-conn').className = 'ok';
    document.getElementById('conn-dot').className = 'connected';
  };
  ws.onclose = () => {
    document.getElementById('sb-conn').innerHTML = '● Bridge disconnected';
    document.getElementById('sb-conn').className = '';
    document.getElementById('conn-dot').className = 'disconnected';
    setTimeout(connectWS, 2000);
  };
  ws.onerror = () => ws.close();
}

// ── Gamepad Polling ────────────────────────────────────
function pollGamepad() {
  const gps = navigator.getGamepads();
  let gp = null;
  for (let i = 0; i < gps.length; i++) {
    if (gps[i] && gps[i].connected) { gp = gps[i]; break; }
  }

  if (gp && gp.connected) {
    document.getElementById('controller-name').textContent = gp.id || 'Gamepad';
    document.getElementById('info-id').textContent = gp.id ? gp.id.slice(0, 40) : '-';
    document.getElementById('info-mapping').textContent = gp.mapping || 'standard';
    document.getElementById('info-btns').textContent = gp.buttons.length;
    document.getElementById('info-axes').textContent = gp.axes.length;

    // Axes: read directly (no remapping needed for axes)
    const axes = [];
    for (let i = 0; i < 6; i++) axes.push(gp.axes[i] || 0);

    // Buttons: remap Web API → SDL2 order
    const sdl2Buttons = new Array(13).fill(0);
    for (let i = 0; i < Math.min(gp.buttons.length, 17); i++) {
      if (gp.buttons[i].pressed) {
        const sdl2Idx = WEB2SDL2[i];
        if (sdl2Idx >= 0 && sdl2Idx < 13) sdl2Buttons[sdl2Idx] = 1;
      }
    }

    // D-pad hat from Web API buttons 12-15
    const hat = [
      (gp.buttons[15]?.pressed ? 1 : 0) - (gp.buttons[14]?.pressed ? 1 : 0),
      (gp.buttons[12]?.pressed ? 1 : 0) - (gp.buttons[13]?.pressed ? 1 : 0),
    ];

    applyState({ axes, buttons: sdl2Buttons, hat });

    // Send SDL2-remapped data to bridge
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ ts: Date.now() / 1000, axes, buttons: sdl2Buttons, hat }));
    }
  } else {
    document.getElementById('controller-name').textContent = 'No Controller';
    document.getElementById('info-conn').textContent = 'No';
    document.getElementById('info-conn').className = 'value warn';
    document.getElementById('conn-dot').className = 'disconnected';
    document.getElementById('sb-conn').innerHTML = '● No Controller';
    document.getElementById('sb-conn').className = '';
  }

  requestAnimationFrame(pollGamepad);
}

connectWS();
pollGamepad();
</script>
